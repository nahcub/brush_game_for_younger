<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공룡 양치</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="world">
      <div id="hud">
        <img id="hud-mascot" src="/art/mascot-icon.png" alt="" />
        <div id="gauge"><div id="gauge-fill"></div></div>
        <!-- 소리 끄기. 아이가 아니라 매장·보호자를 위한 버튼이라 게이지 옆 구석에 작게 둔다 -->
        <button id="mute" class="btn btn--mute" aria-label="소리 끄기" aria-pressed="false">
          <span id="mute-icon">🔊</span>
        </button>
      </div>

      <div id="stage">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="vignette"></div>

        <!-- "여기를 닦아"를 말 대신 위치로 지시하는 칫솔. 화면은 거울이라 보이는 자리에
             손을 대면 그게 맞는 쪽이다 — 좌우를 말로 시키면 아이는 반대로 간다.
             네 칸을 도는 동안 입 주위 네 자리로 옮겨 다니며 상하좌우로 뒤집힌다. -->
        <img id="nudge-brush" src="/art/brush.png" alt="" />

        <!-- 칸이 넘어갈 때 아래에서 점프해 올라오는 마스코트. 칫솔이 다른 자리로 옮겨간 걸
             아이가 놓치지 않도록 시선을 한 번 끊어준다. -->
        <img id="cheer" src="/art/mascot-cheer.png" alt="" />

        <!-- 시작: 글자를 못 읽는 아이에게 마스코트가 "여기 봐"를 대신한다 -->
        <div id="start" class="screen">
          <img id="start-title" src="/art/title.png" alt="Brush with Dino!" />
          <img id="start-mascot" src="/art/mascot-hello.png" alt="" />
          <button id="start-btn" class="btn btn--play" disabled aria-label="시작">
            <span id="start-icon">…</span>
          </button>
        </div>

        <!-- 완료: 몰에서는 다시 오지 않는다. 그 자리에서 바로 열어준다 -->
        <div id="complete" class="screen hidden">
          <img id="box-img" src="/art/box-closed.png" alt="상자" />
          <div id="item" class="hidden">
            <div id="item-emoji">🎁</div>
            <div id="item-name"></div>
          </div>
          <button id="restart" class="btn btn--again hidden" aria-label="다시 하기">↻</button>
        </div>
      </div>

      <!-- 입에서 나온 거품이 상단 게이지까지 날아가는 층.
           #stage는 overflow:hidden이라 카메라 창을 넘지 못한다. 그래서 별도 캔버스다. -->
      <canvas id="flow"></canvas>
    </main>

    <!-- 개발용. 기본은 숨김, D키로 켠다 -->
    <div id="dev" class="hidden">
      <span id="status">대기 중</span>
      <span id="brush-status">멈춤</span>
      <span id="gauge-time">0:00 / 0:20</span>
      <span id="quadrant">칸 1/4</span>
      <span id="debug">움직임: — · 판정: — · FPS: —</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
