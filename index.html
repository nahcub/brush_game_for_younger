<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공룡 양치</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="world">
      <div id="hud">
        <img id="hud-mascot" src="/art/mascot.png" alt="" />
        <div id="gauge"><div id="gauge-fill"></div></div>
      </div>

      <div id="stage">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="vignette"></div>

        <!-- 시작: 글자를 못 읽는 아이에게 마스코트가 "여기 봐"를 대신한다 -->
        <div id="start" class="screen">
          <img id="start-mascot" src="/art/mascot.png" alt="" />
          <button id="start-btn" class="btn btn--play" disabled aria-label="시작">
            <span id="start-icon">…</span>
          </button>
        </div>

        <!-- 완료: 몰에서는 다시 오지 않는다. 그 자리에서 바로 열어준다 -->
        <div id="complete" class="screen hidden">
          <img id="box-img" src="/art/box-closed.png" alt="상자" />
          <div id="item" class="hidden">
            <div id="item-emoji">🎁</div>
            <div id="item-name"></div>
          </div>
          <button id="restart" class="btn btn--again hidden" aria-label="다시 하기">↻</button>
        </div>
      </div>
    </main>

    <!-- 개발용. 기본은 숨김, D키로 켠다 -->
    <div id="dev" class="hidden">
      <span id="status">대기 중</span>
      <span id="brush-status">멈춤</span>
      <span id="gauge-time">0:00 / 0:20</span>
      <span id="debug">움직임: — · 판정: — · FPS: —</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
